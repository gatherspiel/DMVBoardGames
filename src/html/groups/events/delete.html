<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delete event</title>

    <link rel="stylesheet" href="/styles/sharedHtmlOnlyStyles.css" />
    <link rel="stylesheet" href="/styles/sharedHtmlAndComponentStyles.css" />
    <link rel="stylesheet" href="/styles/ui/groups/deleteGroupStyles.css" />

    <link rel="icon" type="image/ico" href="/assets/images/favicon.ico" />

    <script type="module">
      
      import { LOGIN_STATUS_STORE} from "/data/user/LoginStatusStore";
      import {PresentationComponent} from "/lib/places-js-latest.js";

      import { DeleteEventComponent } from "/ui/groups/events/DeleteEventComponent.js";
      customElements.define(
        "delete-event-component",
        DeleteEventComponent,
      );
      customElements.define("presentation-component", PresentationComponent);

    </script>
  </head>
  <body>
    {{>navbar}}

      <delete-event-component
        data-template
      >
        <div 
          class="container-xl"
        >      
          <h1>{formTitle}</h1>
          <form onsubmit="return false">
            <div id="form-status-div">
              <span 
                class={successStyle} 
                textContent={successMessage}
              >
              </span>
              <span class="error-message">{errorMessage}</span>
            </div>     
            <div class = "form-section">
              <label class="required-field">Enter event name to confirm deleting</label>
              <input
                  id="event-name-input"
               />
            </div>
              <button 
                class="primary"
                id="confirm-delete-button-id"
                onClick={deleteEvent}
              >
               Confirm delete</button>
          </form>       

        </div>
      </delete-event-component>
  </body>
</html>
