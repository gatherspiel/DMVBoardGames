<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="/styles/sharedHtmlOnlyStyles.css" />
    <link rel="stylesheet" href="/styles/sharedHtmlAndComponentStyles.css" />
    <link rel="stylesheet" href="/styles/ui/groups/groupStyles.css" />

    <link rel="icon" type="image/ico" href="/assets/images/favicon.ico" />
    <title>GroupSearchResult Information</title>
    <script type="module">
      import { LoadingIndicatorComponent } from "/shared/components/LoadingIndicatorComponent.js";
      import * as stores from "/data/groups/GroupInfoStore.js"
      import { LOGIN_STATUS_STORE} from "/data/user/LoginStatusStore";
      import {PresentationComponent} from "/lib/places-js-latest.js";
      customElements.define(
        "loading-indicator-component",
        LoadingIndicatorComponent,
      );
      customElements.define("presentation-component", PresentationComponent);
      const params = new URLSearchParams(document.location.search);
      document.title = params.get("name");
    </script>
  </head>
  <body>
    {{>navbar}}

    <div class="container-xl"> 
      <presentation-component
        data-template
        data-store="user-group-action-store"
      >
        <div visibility={loggedIn}>
          <a 
            class="btn secondary"
            href={editGroupUrl}
            id="edit-group-button-id"
            visibility={canEdit}
          >
            Edit group information
          </a>
          <a 
            class="btn secondary"
            href={addEventUrl}
            visibility={canEdit} 
          >
            Add event
          </a>
          <a 
            class="btn secondary"
            href={deleteGroupUrl}
            visibility="{canEdit}"
          >
            Delete group
          </a>
             
          <a 
            class="btn secondary" 
            href={joinGroupUrl}
            id="join-group-id">
              {joinGroupText}
          </a>
        </div> 

      </presentation-component>
      <presentation-component
        data-template
        data-store="group-summary-store" 
      >  
        <div class="fade-in-animation ui-section">
          <h1 id="group-name-header">{name}</h1>
          <a class="secondary btn" href={url}>Group website</a>
          <div>
            {groupImage}
          </div>
          <div class="group-description">
            <h2>Group description</h2>
            <div id="group-description-text">
              <span>{description}</span> 
            </div>
          </div>
        </div>
      </presentation-component>

      <presentation-component
        data-store = "group-weekly-event-store"
        data-template
      >
      <div id=${key} class="event">
        <a class="btn secondary" href="${url}">${eventData.name}</a> 
        <rsvp-component
          current-user-rsvp=${eventData.userHasRsvp}
          event-id=${eventData.id}
          rsvp-count=${eventData.rsvpCount}
          user-can-update-rsvp=${eventData.permissions.userCanRsvp}
        ></rsvp-component>
        <p class="event-time">{eventTime}</p>
        <p class="event-location">${eventData.location}</p>
      </div>
      <div class="section-separator-small"></div>
    </presentation-component>
   
    <presentation-component
      data-store="group-one-time-event-store"
    >

    </presentation-component>

    const url = `/html/groups/event.html?id=${encodeURIComponent(eventData.id)}&groupId=${encodeURIComponent(groupId)}`;
    return `
      <div id=${key} class="event">
        <a class="btn secondary" href=${url}>${eventData.name}</a>   
        <p class = "event-time">${eventData.startDate} ${eventData.startTime}</p>
        <p class = "event-location">Location: ${eventData.location}</p>
      </div>
      <div class="section-separator-small"></div>
    `;
  }
    -->
 
    </div>
  </body>
</html>
