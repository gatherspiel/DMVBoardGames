    #search-groups-link {
      margin-bottom: 0.5em;

</style>
<div id="top-section"></div>
<header class="container-xl margin-end-m">
  <nav id="main-nav" class="navbar">
    <a class="logo" href="/index.html">DMV Board Games</a>
    <ul>
      <li>
        <a
          id="search-groups-link"
          class="btn primary"
          href="/html/list/searchGroups.html"
          >Search groups</a
        >
      </li>

        <presentation-component
          data-store="logged-off-status-store"
          data-template

        <li>
          <div style="{showIfLoggedOff}">

            <a

              href="/html/user/createAccount.html"

            </a>
          </div>
        </li>
        </presentation-component>

        <presentation-component
          data-store = "login-status-store"
          data-template
        >	
          <li>
          <div  style="{showIfLoggedIn}">
            <a 
              class="btn secondary" 
              href="/html/user/logout.html"
              id="sign-out-link-id"
            >
              Sign out
            </a>
            <a 
              class="btn secondary" 
              href="/html/user/editProfile.html"
              id="edit-profile-link"
            >Edit profile
            </a>
            <span id="username-display">{username}</span>
            <div id="user-image-container">
              <img class="avatar" id="user-image-icon" src="${imageFilePath}"/>
            </div>
          </div>
          </li>
			  </presentation-component>				 
    </ul>
  </nav>
</header>

<script>
  const hexagons = window.innerWidth / 240.0;

  //Center based on position of top row of hexagons
  if (hexagons - Math.floor(hexagons) < 0.5) {
    const totalMargin = window.innerWidth - 240 * Math.floor(hexagons);
    document.getElementsByClassName("part-1").item(0).style =
      `z-index:-100;position: absolute;top: 0;left:${totalMargin / 2}px;`;
    document.getElementsByClassName("part-2").item(0).style =
      `z-index: -100;position: absolute;top: calc(var(--s)*0.86610);left:${120 + totalMargin / 2}px;`;
  } else {
    const totalMargin = window.innerWidth - (240 * Math.floor(hexagons) + 120);
    document.getElementsByClassName("part-1").item(0).style =
      `z-index:-100;position: absolute;top: 0;left:${totalMargin / 2}px;`;
    document.getElementsByClassName("part-2").item(0).style =
      `z-index: -100;position: absolute;top: calc(var(--s)*0.86610);left:${120 + totalMargin / 2}px;`;
  }
</script>
