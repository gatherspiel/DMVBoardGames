<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Game stores</title>
    <style src="../public/styles/sharedHtmlOnlyStyles.css"></style>
    <style src="../public/styles/sharedHtmlAndComponentStyles.css"></style>
    <link rel="stylesheet" href="/styles/ui/list/gameStoreStyles.css" />

    <link rel="preconnect" href="localhost:7070" />
    <link rel="preconnect" href="api.gatherspiel.com" />

    <script type="module">
			
      import { LoadingIndicatorComponent } from "/shared/components/LoadingIndicatorComponent.js"; 
			import { PresentationComponent } from "/lib/places-js-latest.js";

			import { LOGIN_STATUS_STORE } from "/data/user/LoginStatusStore.js";

      customElements.define("presentation-component", PresentationComponent);

    </script>

    <link rel="icon" type="image/ico" href="/assets/images/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DMV Board Games</title>
  </head>
  <body>
    {{>navbar}}

	 
		<div class="container-xl ui-section">
			
			<h1>Game Stores</h1>
			<presentation-component
				data-api-path="/searchLocations?area=dmv&locationType=gameStores"
				data-api-root={apiRoot}
				data-template
			> 
					<ul>
						<li class="game-store-list-item">
							<a class="btn secondary" href={url}">
								{id}
							</a>
							<p>Location: {location}</p>
						</li>
					</ul>
			</preasentation-component>

		</div>
    {{>footer}}
  </body>
</html>
