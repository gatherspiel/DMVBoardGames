<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/styles/sharedHtmlOnlyStyles.css" />
    <link rel="stylesheet" href="/styles/sharedHtmlAndComponentStyles.css" />

    <link rel="icon" type="image/ico" href="/assets/images/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>

    <script defer fetchpriority="low" type="module">
      import { LoginStatusComponent } from "../../ui/shared/LoginStatusComponent.js";
      import { LoginComponent } from "../../ui/user/LoginComponent.js";
      import { LoginTemplateComponent } from "../../ui/user/LoginTemplateComponent.js";

      customElements.define("login-status-component", LoginStatusComponent);
      customElements.define("login-component", LoginComponent);

      import { GetGameAdvice } from "../../beta/getGameAdvice.js";
      //GetGameAdvice();
    </script>
  </head>
  <body>
    {{>navbar}}

			<login-component
				data-store="login-store"	
			>
			  <div class="container-xl" data-template id="login-component-container">
					<form id="login-form" onsubmit="return false">
						<div innerHTML={newUserMessage}>
						</div>
						<div class="ui-input">
							<div class="form-section">
								<label class="required-field" id="email">Email</label>
							<input        
								id="username-input"
								type="email"
							/>     
							</input>    
						</div>
						<div class="form-section">
						<label class="required-field">Password</label>
							<input        
								id="password-input>
								type="password"
							/>
							</input> 
						</div>
					</div>       
					<div id="component-buttons">
						<button 
							class="primary" 
							onclick="{login}"
							type="submit" 
							id="login-button">Login
						</button>   
						</div>	
						<div innerHTML={loginError}></div>
        </div>
			</login-component>
		
    <div id="bot-container"></div>
  </body>
</html>
