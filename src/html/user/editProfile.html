    <title>Edit profile</title>
    <link rel="stylesheet" href="/styles/sharedHtmlOnlyStyles.css" />
    <link rel="stylesheet" href="/styles/sharedHtmlAndComponentStyles.css" />

    <link rel="stylesheet" href="/styles/designersAndLinks.css" />
    <link rel="icon" type="image/ico" href="/assets/images/favicon.ico" />

      import { PresentationComponent} from "/lib/places-js-latest.js"
      
      customElements.define("edit-profile-component", EditProfileComponent);
      customElements.define("presentation-component", PresentationComponent);
      import { GetGameAdvice } from "../../beta/getGameAdvice.js";
      GetGameAdvice();
    </script>

    {{>navbar}}

    <div class="container-xl"> 

      <h1>Edit profile</h1>
      <edit-profile-component>
        
        <div data-template>
          <form>
            <div>
              <span>{successMessage}</span>
              <span>{errorMessage}</span>
              <input id="username-input-two" name="username-input-two"/>
              <span class="error-message">{usernameError}</span>
            </div>

            <div class ="form-section" id="image-upload">
              <image-upload-component
                id="image-upload-ui"
                image-path={imageFilePath}
              ></image-upload-component>
            </div> 
            <button 
              class="primary" 
              id="update-user-profile" 
              onClick={updateUserProfile}
              type="submit"
            >
              Submit
            </button>
          </form>
        </div>
